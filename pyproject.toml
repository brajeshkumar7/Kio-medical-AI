[build-system]
requires = ["setuptools>=77,<83", "wheel>=0.48,<0.49"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-chatbot-genai"
version = "0.1.0"
description = "KIO medical education assistant backend"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "Flask>=3.1,<4",
  "langchain>=0.3,<0.4",
  "langchain-community>=0.3,<0.4",
  "langchain-core>=0.3,<0.4",
  "langchain-openai>=0.3,<0.4",
  "langchain-pinecone==0.2.3",
  "langchain-text-splitters>=0.3,<0.4",
  "pypdf>=5,<6",
  "python-dotenv>=1,<2",
  "pinecone>=5.4,<6",
  "numpy>=1.26.4,<2",
  "aiohttp>=3.10,<3.11",
  "flask-cors>=5,<6",
  "Flask-Migrate>=4,<5",
  "Flask-SQLAlchemy>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3",
  "gunicorn>=23,<24",
  "openai>=2,<3",
  "httpx>=0.28,<1",
  "SQLAlchemy>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.11,<1",
  "pip-tools>=7.4,<8",
  "build>=1.2,<2",
]

[tool.setuptools]
py-modules = ["app", "store_index"]
include-package-data = false

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "python -m backend.jobs.prepare_vercel_cache"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend", "backend.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["postgres: requires a disposable TEST_POSTGRES_URL database"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["backend/**/*.py", "tests/**/*.py", "app.py", "store_index.py"]
extend-exclude = ["legacy", "research", "migrations", ".cache", "frontend", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
