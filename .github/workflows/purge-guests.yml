name: Purge inactive guest chats

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m backend.jobs.purge_guests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
